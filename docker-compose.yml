services:
  mongo:
    image: mongo:7
    container_name: admision-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

  neo4j:
    image: neo4j:5-community
    container_name: admision-neo4j
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?define NEO4J_PASSWORD en .env}"
    volumes:
      - neo4j-data:/data

volumes:
  mongo-data:
  neo4j-data:
